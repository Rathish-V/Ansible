- name: Linux Patching Test
  hosts: all
  become: yes

  tasks:

    - name: Get hostname
      command: hostname
      register: hostname_output

    - name: Get RepoList
      command: yum repolist
      register: repolist_output

    - name: Check for Updates
      shell: yum check-update || true
      register: check_output

    - name: Update Packages
      command: yum update -y
      register: update_output

    - name: Get Last Transaction
      shell: yum history info last
      register: history_output
      failed_when: false

    - name: Reboot the server after patching
      reboot:
        msg: "Rebooting server after patching via Ansible"
        reboot_timeout: 600      # Wait up to 10 minutes for the server to come back
        post_reboot_delay: 30    # Wait 30 seconds after it comes back before continuing

    - name: Check server uptime
      command: uptime
      register: uptime_output

    - name: Create reports directory on jump server
      delegate_to: localhost
      run_once: true
      vars:
        ansible_become: false
      file:
        path: "/home/azureuser/ansible/reports"
        state: directory
        mode: '0755'

    - name: Create Patch Report on jump server
      delegate_to: localhost
      vars:
        ansible_become: false
      copy:
        dest: "/home/azureuser/ansible/reports/{{ hostname_output.stdout }}_patch_report_{{ lookup('pipe', 'date +%Y%m%d') }}.txt"
        content: |
          ======================================================
          PATCH REPORT
          ======================================================

          Hostname: {{ hostname_output.stdout }}

          ======================================================
          REPOSITORIES
          ======================================================

          {{ repolist_output.stdout }}

          ======================================================
          AVAILABLE UPDATES BEFORE PATCHING
          ======================================================

          {{ check_output.stdout }}

          ======================================================
          PATCH EXECUTION OUTPUT
          ======================================================

          {{ update_output.stdout }}

          ======================================================
          LAST YUM/DNF TRANSACTION
          ======================================================

          {{ history_output.stdout }}

          ======================================================
          SYSTEM UPTIME (POST-REBOOT)
          ======================================================

          {{ uptime_output.stdout }}


    - name: Display Results
      debug:
        msg:
          - "Hostname: {{ hostname_output.stdout }}"
          - "Report Created: /ansible/reports/{{ hostname_output.stdout }}_patch_report_{{ lookup('pipe', 'date +%Y%m%d') }}.txt"